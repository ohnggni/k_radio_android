name: Build test APK

# 푸시할 때마다 개발용(.debug) APK를 빌드해서 실행 결과의 첨부 파일(Artifacts)로 올림 (14일 보관)
# 받는 곳: 저장소 Actions → 해당 실행 → 맨 아래 Artifacts (로그인 필요, zip으로 받음)
# 정식 배포(release.sh)와는 별개. 정식 서명 키는 쓰지 않음
on:
  push:
    branches: [main, "feature/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Secrets → secrets.properties, debug keystore
        env:
          SECRETS_PROPERTIES: ${{ secrets.SECRETS_PROPERTIES }}
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          test -n "$SECRETS_PROPERTIES" || { echo "SECRETS_PROPERTIES secret 없음"; exit 1; }
          printf '%s\n' "$SECRETS_PROPERTIES" > secrets.properties
          # 고정 개발 키로 서명 → 폰에서 지우지 않고 덮어쓰기 설치 가능 (없으면 매번 새 키라 재설치 필요)
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::DEBUG_KEYSTORE_B64 secret 없음 - 매번 새 개발 키로 서명됨"
          fi

      - name: Build
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK (Actions 첨부 파일, 공개 릴리스에는 안 올림)
        uses: actions/upload-artifact@v4
        with:
          name: KRadio-dev-b${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
